[project]
name = "seqstats"
version = "0.1.0"
description = "Summary statistics for DNA sequences in a FASTA file"
readme = "README.md"
authors = [
    { name = "Scott Handley", email = "handley.scott@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
seqstats = "seqstats.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
